<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مەخزەنی کارتۆنی زەیت - کارگەی کاشۆ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
    th, td { white-space: nowrap; }
    .nav-link.active {
      background-color: rgba(255, 255, 255, 0.15);
      border-bottom: 3px solid #38bdf8;
      color: #ffffff;
      font-weight: 700;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- ناوپۆشی سەرەکی -->
  <nav class="bg-[#244b5c] text-slate-100 shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-2 sm:px-4 flex items-center justify-between overflow-x-auto">
      <div class="flex items-center gap-1 py-1 text-xs sm:text-sm font-medium">
        <a href="index.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🏠</span> سەرەکی</a>
        <a href="sales.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🛒</span> فرۆشتن</a>
        <a href="suppliers.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🏢</span> دابینکەران</a>
        <a href="customers.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>👥</span> کڕیاران</a>
        <a href="warehouse.html" class="nav-link active flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>📦</span> مەخزەن</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- فۆڕمی ناساندنی کارتۆن -->
      <div class="bg-white p-5 rounded-2xl border shadow-sm h-fit">
        <h2 class="text-sm font-bold text-slate-800 mb-3 pb-2 border-b">ناساندنی کارتۆنی زەیت</h2>
        <form id="oilWarehouseForm" onsubmit="defineReadyOil(event)" class="space-y-3">
          <div><label class="block text-xs font-semibold text-slate-600 mb-1">ناوی کارتۆن / بەرهەم *</label><input type="text" id="oilDefName" required class="w-full border rounded-lg p-2 text-xs"></div>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="block text-xs font-semibold text-slate-600 mb-1">عەدەد لە ١ کارتۆندا *</label><input type="number" step="any" id="oilBottlesPerCarton" required class="w-full border rounded-lg p-2 text-xs"></div>
            <div><label class="block text-xs font-semibold text-slate-600 mb-1">کێشی ١ کارتۆن (Kg) *</label><input type="number" step="any" id="oilWeightPerCarton" required class="w-full border rounded-lg p-2 text-xs"></div>
          </div>
          <div><label class="block text-xs font-semibold text-slate-600 mb-1">نرخی فرۆشتنی ١ کارتۆن (IQD) *</label><input type="number" step="any" id="oilDefPrice" required class="w-full border rounded-lg p-2 text-xs"></div>
          <button type="submit" class="w-full bg-[#244b5c] text-white font-bold py-2.5 rounded-lg text-xs">ناساندن لە مەخزەن</button>
        </form>
      </div>

      <!-- لیستی مەخزەن -->
      <div class="lg:col-span-2 bg-white p-5 rounded-2xl border shadow-sm">
        <h2 class="text-sm font-bold text-slate-800 mb-4">لیستی کارتۆنەکانی مەخزەن</h2>
        <table class="w-full text-right text-xs">
          <thead class="bg-slate-50 border-b text-slate-600">
            <tr><th class="p-3">ناوی بەرهەم</th><th class="p-3">بڕی کارتۆن</th><th class="p-3">عەدەد</th><th class="p-3">کێش</th><th class="p-3">نرخ</th><th class="p-3 text-center">کردار</th></tr>
          </thead>
          <tbody id="oilWarehouseTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let db = {
      readyOil: JSON.parse(localStorage.getItem('oil_db_oil_v6')) || []
    };

    function saveDB() {
      localStorage.setItem('oil_db_oil_v6', JSON.stringify(db.readyOil));
      renderWarehouse();
    }

    function defineReadyOil(e) {
      e.preventDefault();
      db.readyOil.push({
        id: Date.now(),
        name: document.getElementById('oilDefName').value.trim(),
        bottlesPerCarton: parseFloat(document.getElementById('oilBottlesPerCarton').value) || 1,
        weightPerCarton: parseFloat(document.getElementById('oilWeightPerCarton').value) || 0,
        price: parseFloat(document.getElementById('oilDefPrice').value) || 0,
        qty: 0
      });
      saveDB();
      document.getElementById('oilWarehouseForm').reset();
      alert('کارتۆنی زەیت بە سەرکەوتوویی ناسێنرا.');
    }

    function deleteReadyOil(id) {
      if (confirm('سڕینەوەی ئەم بەرهەمە؟')) {
        db.readyOil = db.readyOil.filter(x => x.id !== id);
        saveDB();
      }
    }

    function renderWarehouse() {
      const tbody = document.getElementById('oilWarehouseTableBody');
      tbody.innerHTML = '';
      if (db.readyOil.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-400">هیچ کارتۆنێک لە مەخزەن نییە</td></tr>`;
        return;
      }
      db.readyOil.forEach(o => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50">
            <td class="p-3 font-bold text-[#244b5c]">${o.name}</td>
            <td class="p-3 font-black">${o.qty.toLocaleString()} کارتۆن</td>
            <td class="p-3 text-blue-700">${o.bottlesPerCarton || 1} د.</td>
            <td class="p-3 text-purple-700">${o.weightPerCarton || 0} Kg</td>
            <td class="p-3 font-black text-emerald-700">${o.price.toLocaleString()} IQD</td>
            <td class="p-3 text-center">
              <button onclick="deleteReadyOil(${o.id})" title="سڕینەوە" class="text-rose-500 hover:text-rose-700">🗑️</button>
            </td>
          </tr>
        `;
      });
    }

    renderWarehouse();
  </script>
</body>
</html>
