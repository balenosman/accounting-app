<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بەشی مەواد و پێکهاتەکان - کارگەی کاشۆ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
    th, td { white-space: nowrap; }
    .nav-link.active {
      background-color: rgba(255, 255, 255, 0.15);
      border-bottom: 3px solid #38bdf8;
      color: #ffffff;
      font-weight: 700;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- ناوپۆشی سەرەکی -->
  <nav class="bg-[#244b5c] text-slate-100 shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-2 sm:px-4 flex items-center justify-between overflow-x-auto">
      <div class="flex items-center gap-1 py-1 text-xs sm:text-sm font-medium">
        <a href="index.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🏠</span> سەرەکی</a>
        <a href="sales.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🛒</span> فرۆشتن</a>
        <a href="suppliers.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🏢</span> دابینکەران</a>
        <a href="customers.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>👥</span> کڕیاران</a>
        <a href="warehouse.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>📦</span> مەخزەن</a>
        <a href="purchases.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>📥</span> کڕین</a>
        <a href="production.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>⚙️</span> بەرهەمهێنان</a>
        <a href="materials.html" class="nav-link active flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🌾</span> مەواد</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- فۆڕمی ناساندنی مەواد -->
      <div class="bg-white p-5 rounded-2xl border shadow-sm h-fit">
        <h2 class="text-sm font-bold text-slate-800 mb-3 pb-2 border-b">ناساندنی مەواد و پێکهاتە</h2>
        <form id="materialForm" onsubmit="defineMaterial(event)" class="space-y-3">
          <div><label class="block text-xs font-semibold text-slate-600 mb-1">ناوی مەواد *</label><input type="text" id="matDefName" required class="w-full border rounded-lg p-2 text-xs"></div>
          <div><label class="block text-xs font-semibold text-slate-600 mb-1">دابینکەری تایبەت *</label><select id="matDefSupplier" required class="w-full border rounded-lg p-2 text-xs bg-white"></select></div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">یەکەی پێوانە</label>
            <select id="matDefUnit" class="w-full border rounded-lg p-2 text-xs bg-white">
              <option value="دانە">دانە</option>
              <option value="کیلۆگرام">کیلۆگرام</option>
              <option value="لیتر">لیتر</option>
            </select>
          </div>
          <button type="submit" class="w-full bg-[#244b5c] text-white font-bold py-2.5 rounded-lg text-xs">تۆمارکردنی مەواد</button>
        </form>
      </div>

      <!-- لیستی مەوادەکان -->
      <div class="lg:col-span-2 bg-white p-5 rounded-2xl border shadow-sm">
        <h2 class="text-sm font-bold text-slate-800 mb-4">لیستی مەواد و پێکهاتەکان</h2>
        <table class="w-full text-right text-xs">
          <thead class="bg-slate-50 border-b text-slate-600">
            <tr><th class="p-3">ناو</th><th class="p-3">دابینکەر</th><th class="p-3">بڕی ماوە</th><th class="p-3">تێچووی کۆتایی</th><th class="p-3 text-center">کردار</th></tr>
          </thead>
          <tbody id="materialsTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let db = {
      suppliers: JSON.parse(localStorage.getItem('oil_db_supp_v7')) || [],
      materials: JSON.parse(localStorage.getItem('oil_db_mat_v6')) || []
    };

    function saveDB() {
      localStorage.setItem('oil_db_mat_v6', JSON.stringify(db.materials));
      renderMaterials();
    }

    function initSelects() {
      const suppSel = document.getElementById('matDefSupplier');
      suppSel.innerHTML = '<option value="all">گشتی (هەموو دابینکەران)</option>';
      db.suppliers.forEach(s => {
        suppSel.innerHTML += `<option value="${s.id}">${s.name}</option>`;
      });
    }

    function defineMaterial(e) {
      e.preventDefault();
      const suppId = document.getElementById('matDefSupplier').value;
      const supp = db.suppliers.find(s => s.id.toString() === suppId.toString());
      db.materials.push({
        id: Date.now(),
        name: document.getElementById('matDefName').value.trim(),
        supplierId: suppId,
        supplierName: supp ? supp.name : 'گشتی',
        unit: document.getElementById('matDefUnit').value,
        qty: 0,
        lastCost: 0
      });
      saveDB();
      document.getElementById('materialForm').reset();
      alert('مەوادەکە بە سەرکەوتوویی ناسێنرا.');
    }

    function deleteMaterial(id) {
      if (confirm('سڕینەوەی ئەم مەوادە؟')) {
        db.materials = db.materials.filter(x => x.id !== id);
        saveDB();
      }
    }

    function renderMaterials() {
      initSelects();
      const tbody = document.getElementById('materialsTableBody');
      tbody.innerHTML = '';
      if (db.materials.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">هیچ مەوادێک تۆمار نەکراوە</td></tr>`;
        return;
      }
      db.materials.forEach(m => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50">
            <td class="p-3 font-bold text-[#244b5c]">${m.name}</td>
            <td class="p-3 text-slate-600">${m.supplierName || 'گشتی'}</td>
            <td class="p-3 font-black">${m.qty.toLocaleString()} ${m.unit}</td>
            <td class="p-3 font-black text-emerald-800">${(m.lastCost || 0).toLocaleString()} IQD</td>
            <td class="p-3 text-center">
              <button onclick="deleteMaterial(${m.id})" title="سڕینەوە" class="text-rose-500 hover:text-rose-700">🗑️</button>
            </td>
          </tr>
        `;
      });
    }

    renderMaterials();
  </script>
</body>
</html>
