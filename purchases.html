<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بەشی کڕین - کارگەی کاشۆ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
    th, td { white-space: nowrap; }
    .nav-link.active {
      background-color: rgba(255, 255, 255, 0.15);
      border-bottom: 3px solid #38bdf8;
      color: #ffffff;
      font-weight: 700;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- ناوپۆشی سەرەکی -->
  <nav class="bg-[#244b5c] text-slate-100 shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-2 sm:px-4 flex items-center justify-between overflow-x-auto">
      <div class="flex items-center gap-1 py-1 text-xs sm:text-sm font-medium">
        <a href="index.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🏠</span> سەرەکی</a>
        <a href="sales.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🛒</span> فرۆشتن</a>
        <a href="suppliers.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🏢</span> دابینکەران</a>
        <a href="customers.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>👥</span> کڕیاران</a>
        <a href="warehouse.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>📦</span> مەخزەن</a>
        <a href="purchases.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>📥</span> کڕین</a>
        <a href="production.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>⚙️</span> بەرهەمهێنان</a>
        <a href="materials.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🌾</span> مەواد</a>
        <a href="expenses.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>💸</span> خەرجی</a>
        <a href="reports.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>📊</span> ڕاپۆرت</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- فۆڕمی وەسڵی کڕین -->
      <div class="bg-white p-5 rounded-2xl border shadow-sm h-fit">
        <h2 class="text-sm font-bold text-slate-800 mb-3 pb-2 border-b">تۆمارکردنی وەسڵی کڕین</h2>
        <form id="purchaseForm" onsubmit="handlePurchase(event)" class="space-y-3">
          <div><label class="block text-xs font-semibold text-slate-600 mb-1">دابینکەر *</label><select id="purSupplierSelect" onchange="filterPurchaseMaterialsBySupplier()" required class="w-full border rounded-lg p-2 text-xs bg-white"></select></div>
          <div><label class="block text-xs font-semibold text-slate-600 mb-1">پێکهاتە *</label><select id="purItemSelect" required class="w-full border rounded-lg p-2 text-xs bg-white"></select></div>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="block text-xs font-semibold text-slate-600 mb-1">بڕی کڕدراو *</label><input type="number" step="any" id="purQty" required class="w-full border rounded-lg p-2 text-xs"></div>
            <div><label class="block text-xs font-semibold text-slate-600 mb-1">دراو</label><select id="purCurrency" class="w-full border rounded-lg p-2 text-xs bg-white"><option value="IQD">IQD</option><option value="USD">USD</option></select></div>
          </div>
          <div><label class="block text-xs font-semibold text-slate-600 mb-1">نرخی کڕینی ئەم دانەیە *</label><input type="number" step="any" id="purCost" required class="w-full border rounded-lg p-2 text-xs"></div>
          <button type="submit" class="w-full bg-[#244b5c] text-white font-bold py-2.5 rounded-lg text-xs">تۆمارکردنی کڕین</button>
        </form>
      </div>

      <!-- مێژووی کڕینەکان -->
      <div class="lg:col-span-2 bg-white p-5 rounded-2xl border shadow-sm">
        <h2 class="text-sm font-bold text-slate-800 mb-4">مێژووی وەسڵەکانی کڕین</h2>
        <table class="w-full text-right text-xs">
          <thead class="bg-slate-50 border-b text-slate-600">
            <tr><th class="p-3">دابینکەر</th><th class="p-3">پێکهاتە</th><th class="p-3">بڕ</th><th class="p-3">تێچوو</th><th class="p-3">کۆی گشتی</th><th class="p-3 text-center">کردار</th></tr>
          </thead>
          <tbody id="purchasesTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let db = {
      suppliers: JSON.parse(localStorage.getItem('oil_db_supp_v7')) || [],
      materials: JSON.parse(localStorage.getItem('oil_db_mat_v6')) || [],
      purchases: JSON.parse(localStorage.getItem('oil_db_pur_v6')) || []
    };

    function saveDB() {
      localStorage.setItem('oil_db_supp_v7', JSON.stringify(db.suppliers));
      localStorage.setItem('oil_db_mat_v6', JSON.stringify(db.materials));
      localStorage.setItem('oil_db_pur_v6', JSON.stringify(db.purchases));
      renderPurchases();
    }

    function initSelects() {
      const suppSel = document.getElementById('purSupplierSelect');
      suppSel.innerHTML = '<option value="">دابینکەر هەڵبژێرە...</option>';
      db.suppliers.forEach(s => {
        suppSel.innerHTML += `<option value="${s.id}">${s.name}</option>`;
      });
      filterPurchaseMaterialsBySupplier();
    }

    function filterPurchaseMaterialsBySupplier() {
      const suppId = document.getElementById('purSupplierSelect').value;
      const matSel = document.getElementById('purItemSelect');
      matSel.innerHTML = '<option value="">پێکهاتە هەڵبژێرە...</option>';
      db.materials.filter(m => !m.supplierId || m.supplierId === 'all' || m.supplierId.toString() === suppId.toString()).forEach(m => {
        matSel.innerHTML += `<option value="${m.id}">${m.name} (${m.unit})</option>`;
      });
    }

    function handlePurchase(e) {
      e.preventDefault();
      const suppId = parseInt(document.getElementById('purSupplierSelect').value);
      const matId = parseInt(document.getElementById('purItemSelect').value);
      const qty = parseFloat(document.getElementById('purQty').value) || 0;
      const cost = parseFloat(document.getElementById('purCost').value) || 0;
      const currency = document.getElementById('purCurrency').value;

      const supp = db.suppliers.find(s => s.id === suppId);
      const mat = db.materials.find(m => m.id === matId);
      if (!mat) return;

      const oldStock = mat.qty || 0;
      const oldCost = mat.lastCost || 0;
      const newTotalStock = oldStock + qty;
      mat.lastCost = newTotalStock > 0 ? ((oldStock * oldCost) + (qty * cost)) / newTotalStock : cost;
      mat.qty = newTotalStock;

      const total = qty * cost;
      if (supp) {
        if (currency === 'USD') supp.debtUSD = (supp.debtUSD || 0) + total;
        else supp.debtIQD = (supp.debtIQD || 0) + total;
      }

      db.purchases.unshift({ id: Date.now(), matId: mat.id, suppName: supp ? supp.name : '-', matName: mat.name, qty, cost, currency, total });
      saveDB();
      document.getElementById('purchaseForm').reset();
      alert('وەسڵی کڕین بە سەرکەوتوویی تۆمارکرا.');
    }

    function deletePurchase(id) {
      if (confirm('سڕینەوەی ئەم وەسڵەی کڕینە؟')) {
        db.purchases = db.purchases.filter(x => x.id !== id);
        saveDB();
      }
    }

    function renderPurchases() {
      initSelects();
      const tbody = document.getElementById('purchasesTableBody');
      tbody.innerHTML = '';
      if (db.purchases.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-400">هیچ وەسڵێکی کڕین تۆمار نەکراوە</td></tr>`;
        return;
      }
      db.purchases.forEach(p => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50">
            <td class="p-3 font-bold">${p.suppName}</td>
            <td class="p-3">${p.matName}</td>
            <td class="p-3 font-bold">${p.qty}</td>
            <td class="p-3">${p.cost.toLocaleString()} ${p.currency || 'IQD'}</td>
            <td class="p-3 font-black text-indigo-700">${p.total.toLocaleString()} ${p.currency || 'IQD'}</td>
            <td class="p-3 text-center">
              <button onclick="deletePurchase(${p.id})" title="سڕینەوە" class="text-rose-500 hover:text-rose-700">🗑️</button>
            </td>
          </tr>
        `;
      });
    }

    renderPurchases();
  </script>
</body>
</html>
