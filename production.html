<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بەشی بەرهەمهێنان - کارگەی کاشۆ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
    th, td { white-space: nowrap; }
    .nav-link.active {
      background-color: rgba(255, 255, 255, 0.15);
      border-bottom: 3px solid #38bdf8;
      color: #ffffff;
      font-weight: 700;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- ناوپۆشی سەرەکی -->
  <nav class="bg-[#244b5c] text-slate-100 shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-2 sm:px-4 flex items-center justify-between overflow-x-auto">
      <div class="flex items-center gap-1 py-1 text-xs sm:text-sm font-medium">
        <a href="index.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🏠</span> سەرەکی</a>
        <a href="sales.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🛒</span> فرۆشتن</a>
        <a href="suppliers.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🏢</span> دابینکەران</a>
        <a href="customers.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>👥</span> کڕیاران</a>
        <a href="warehouse.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>📦</span> مەخزەن</a>
        <a href="purchases.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>📥</span> کڕین</a>
        <a href="production.html" class="nav-link active flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>⚙️</span> بەرهەمهێنان</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl border shadow-sm space-y-4">
      <h2 class="text-base font-bold text-slate-800 border-b pb-2">بەرهەمهێنانی زەیت (بە کارتۆن)</h2>
      <form id="produceForm" onsubmit="handleProduction(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">جۆری کارتۆنی زەیت *</label>
          <select id="produceOilSelect" onchange="showBOMPreview()" required class="w-full border rounded-lg p-2.5 text-xs bg-white"></select>
        </div>

        <div id="bomPreviewBox" class="p-3 bg-slate-50 border rounded-lg text-xs space-y-1 hidden">
          <div class="flex justify-between items-center mb-1">
            <span class="font-bold text-slate-700">پێکهاتەی پێویست بۆ هەر ١ کارتۆن:</span>
            <span id="bomCostPreviewBadge" class="bg-rose-100 text-rose-800 px-2 py-0.5 rounded font-bold">تێچوو: 0 IQD</span>
          </div>
          <ul id="bomPreviewList" class="list-disc list-inside text-slate-600 space-y-0.5"></ul>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">ژمارەی کارتۆنی بەرهەمهاتوو *</label>
          <input type="number" step="any" id="produceQty" required class="w-full border rounded-lg p-2.5 text-xs">
        </div>

        <button type="submit" class="w-full bg-[#244b5c] text-white font-bold py-2.5 rounded-lg text-xs">تەواوکردنی بەرهەمهێنان</button>
      </form>
    </div>
  </main>

  <script>
    let db = {
      readyOil: JSON.parse(localStorage.getItem('oil_db_oil_v6')) || [],
      materials: JSON.parse(localStorage.getItem('oil_db_mat_v6')) || [],
      productions: JSON.parse(localStorage.getItem('oil_db_prod_v8')) || []
    };

    function saveDB() {
      localStorage.setItem('oil_db_oil_v6', JSON.stringify(db.readyOil));
      localStorage.setItem('oil_db_mat_v6', JSON.stringify(db.materials));
      localStorage.setItem('oil_db_prod_v8', JSON.stringify(db.productions));
    }

    function initSelects() {
      const prodSel = document.getElementById('produceOilSelect');
      prodSel.innerHTML = '<option value="">کارتۆنی زەیت هەڵبژێرە...</option>';
      db.readyOil.forEach(o => {
        prodSel.innerHTML += `<option value="${o.id}">${o.name}</option>`;
      });
    }

    function showBOMPreview() {
      const oilId = parseInt(document.getElementById('produceOilSelect').value);
      const oil = db.readyOil.find(o => o.id === oilId);
      const box = document.getElementById('bomPreviewBox');
      const list = document.getElementById('bomPreviewList');
      const badge = document.getElementById('bomCostPreviewBadge');

      if (!oil || !oil.bom || oil.bom.length === 0) {
        box.classList.add('hidden');
        return;
      }

      list.innerHTML = '';
      let totalCost = 0;
      oil.bom.forEach(b => {
        const mat = db.materials.find(m => m.id === b.matId);
        const cost = b.qty * (mat ? (mat.lastCost || 0) : 0);
        totalCost += cost;
        list.innerHTML += `<li>${b.matName}: <strong>${b.qty} ${b.unit}</strong></li>`;
      });

      badge.innerText = `تێچوو: ${totalCost.toLocaleString()} IQD`;
      box.classList.remove('hidden');
    }

    function handleProduction(e) {
      e.preventDefault();
      const oilId = parseInt(document.getElementById('produceOilSelect').value);
      const produceCartons = parseFloat(document.getElementById('produceQty').value) || 0;
      const oil = db.readyOil.find(o => o.id === oilId);
      if (!oil) return;

      if (oil.bom && oil.bom.length > 0) {
        for (let b of oil.bom) {
          const mat = db.materials.find(m => m.id === b.matId);
          if (!mat || mat.qty < (b.qty * produceCartons)) {
            alert(`بڕی پێکهاتەی (${b.matName}) بەش ناکات!`);
            return;
          }
        }
        for (let b of oil.bom) {
          const mat = db.materials.find(m => m.id === b.matId);
          mat.qty -= (b.qty * produceCartons);
        }
      }

      oil.qty += produceCartons;
      db.productions.unshift({ id: Date.now(), oilId: oil.id, oilName: oil.name, cartonsProduced: produceCartons });
      saveDB();
      document.getElementById('produceForm').reset();
      document.getElementById('bomPreviewBox').classList.add('hidden');
      alert(`بەرهەمهێنانی ${produceCartons} کارتۆن سەرکەوتوو بوو.`);
    }

    initSelects();
  </script>
</body>
</html>
