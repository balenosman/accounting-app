<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بەشی دابینکەران - کارگەی کاشۆ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
    th, td { white-space: nowrap; }
    .nav-link.active {
      background-color: rgba(255, 255, 255, 0.15);
      border-bottom: 3px solid #38bdf8;
      color: #ffffff;
      font-weight: 700;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- ناوپۆشی سەرەکی -->
  <nav class="bg-[#244b5c] text-slate-100 shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-2 sm:px-4 flex items-center justify-between overflow-x-auto">
      <div class="flex items-center gap-1 py-1 text-xs sm:text-sm font-medium">
        <a href="index.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🏠</span> سەرەکی</a>
        <a href="sales.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🛒</span> فرۆشتن</a>
        <a href="suppliers.html" class="nav-link active flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🏢</span> دابینکەران</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- فۆڕمی تۆمارکردنی دابینکەر -->
      <div class="bg-white p-5 rounded-2xl border shadow-sm h-fit">
        <h2 class="text-sm font-bold text-slate-800 mb-3 pb-2 border-b">تۆمارکردنی دابینکەری نوێ</h2>
        <form id="supplierForm" onsubmit="addSupplier(event)" class="space-y-3">
          <div><label class="block text-xs font-semibold text-slate-600 mb-1">ناوی کەس / کۆمپانیا *</label><input type="text" id="suppName" required class="w-full border rounded-lg p-2 text-xs"></div>
          <div><label class="block text-xs font-semibold text-slate-600 mb-1">ژمارەی مۆبایل</label><input type="text" id="suppPhone" class="w-full border rounded-lg p-2 text-xs"></div>
          <div><label class="block text-xs font-semibold text-slate-600 mb-1">ناونیشان</label><input type="text" id="suppAddress" class="w-full border rounded-lg p-2 text-xs"></div>
          <button type="submit" class="w-full bg-[#244b5c] text-white font-bold py-2.5 rounded-lg text-xs">تۆمارکردن</button>
        </form>
      </div>

      <!-- لیستی دابینکەران -->
      <div class="lg:col-span-2 bg-white p-5 rounded-2xl border shadow-sm">
        <h2 class="text-sm font-bold text-slate-800 mb-4">لیستی دابینکەران (کلیک لەسەر ناو بۆ کەشف حساب)</h2>
        <table class="w-full text-right text-xs">
          <thead class="bg-slate-50 border-b text-slate-600">
            <tr><th class="p-3">ناو</th><th class="p-3">مۆبایل</th><th class="p-3">ناونیشان</th><th class="p-3">قەرز</th><th class="p-3 text-center">کردار</th></tr>
          </thead>
          <tbody id="suppliersTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let db = {
      suppliers: JSON.parse(localStorage.getItem('oil_db_supp_v7')) || []
    };

    function saveDB() {
      localStorage.setItem('oil_db_supp_v7', JSON.stringify(db.suppliers));
      renderSuppliers();
    }

    function addSupplier(e) {
      e.preventDefault();
      db.suppliers.push({
        id: Date.now(),
        name: document.getElementById('suppName').value.trim(),
        phone: document.getElementById('suppPhone').value.trim(),
        address: document.getElementById('suppAddress').value.trim(),
        debtIQD: 0,
        debtUSD: 0
      });
      saveDB();
      document.getElementById('supplierForm').reset();
      alert('دابینکەر بە سەرکەوتوویی تۆمارکرا.');
    }

    function deleteSupplier(id) {
      if (confirm('سڕینەوەی ئەم دابینکەرە؟')) {
        db.suppliers = db.suppliers.filter(x => x.id !== id);
        saveDB();
      }
    }

    function renderSuppliers() {
      const tbody = document.getElementById('suppliersTableBody');
      tbody.innerHTML = '';
      if (db.suppliers.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">هیچ دابینکەرێک تۆمار نەکراوە</td></tr>`;
        return;
      }
      db.suppliers.forEach(s => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50">
            <td class="p-3 font-bold text-[#244b5c]">${s.name}</td>
            <td class="p-3" dir="ltr">${s.phone || '-'}</td>
            <td class="p-3">${s.address || '-'}</td>
            <td class="p-3 font-bold text-rose-600">${(s.debtIQD || 0).toLocaleString()} IQD</td>
            <td class="p-3 text-center">
              <button onclick="deleteSupplier(${s.id})" title="سڕینەوە" class="text-rose-500 hover:text-rose-700">🗑️</button>
            </td>
          </tr>
        `;
      });
    }

    renderSuppliers();
  </script>
</body>
</html>
