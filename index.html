<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستەمی حساباتی کارگەی زەیت - کاشۆ</title>
  <script src="global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
    .nav-link.active {
      background-color: rgba(255, 255, 255, 0.15);
      border-bottom: 3px solid #38bdf8;
      color: #ffffff;
      font-weight: 700;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- ناوپۆشی سەرەکی (پەیجە جیایەکان) -->
  <nav class="bg-[#244b5c] text-slate-100 shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-2 sm:px-4 flex items-center justify-between overflow-x-auto">
      <div class="flex items-center gap-1 py-1 text-xs sm:text-sm font-medium">
        <a href="index.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🏠</span> سەرەکی</a>
        <a href="sales.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🛒</span> فرۆشتن</a>
        <a href="suppliers.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🏢</span> دابینکەران</a>
        <a href="customers.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>👥</span> کڕیاران</a>
        <a href="warehouse.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>📦</span> مەخزەن</a>
        <a href="purchases.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>📥</span> کڕین</a>
        <a href="production.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>⚙️</span> بەرهەمهێنان</a>
        <a href="materials.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>🌾</span> مەواد</a>
        <a href="expenses.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>💸</span> خەرجی</a>
        <a href="reports.html" class="nav-link flex items-center gap-1 px-3 py-3 rounded-t-lg transition hover:bg-white/10"><span>📊</span> ڕاپۆرت</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
      <h1 class="text-xl font-black text-[#244b5c]">بەڕێوەبەری کارگەی زەیتی کاشۆ</h1>
      <p class="text-xs text-slate-500">بەخێربێن بۆ سیستەمی حساباتی فەرمی. لە ڕێگەی مێنوی سەرەوە دەتوانیت بە ئاسانی پەیجەکان بگۆڕیت.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-2xl border shadow-sm">
        <span class="text-xs font-bold text-slate-500">پارەی سندوق</span>
        <p id="dashCashBoxIQD" class="text-lg font-black text-blue-600 mt-1">0 IQD</p>
      </div>
      <div class="bg-white p-5 rounded-2xl border shadow-sm">
        <span class="text-xs font-bold text-slate-500">قەرزی کڕیاران</span>
        <p id="dashCustDebtIQD" class="text-lg font-black text-amber-600 mt-1">0 IQD</p>
      </div>
      <div class="bg-white p-5 rounded-2xl border shadow-sm">
        <span class="text-xs font-bold text-slate-500">سەرمایەی مەخزەن</span>
        <p id="dashCapitalStockIQD" class="text-lg font-black text-[#244b5c] mt-1">0 IQD</p>
      </div>
    </div>
  </main>

  <script>
    // خویندنەوەی داتا گشتییەکان بۆ داشبۆرد
    let db = {
      customers: JSON.parse(localStorage.getItem('oil_db_cust_v6')) || [],
      sales: JSON.parse(localStorage.getItem('oil_db_sal_v6')) || [],
      readyOil: JSON.parse(localStorage.getItem('oil_db_oil_v6')) || [],
      materials: JSON.parse(localStorage.getItem('oil_db_mat_v6')) || []
    };

    let totalCustDebt = 0;
    db.customers.forEach(c => totalCustDebt += (c.debtIQD || c.debt || 0));
    document.getElementById('dashCustDebtIQD').innerText = totalCustDebt.toLocaleString() + ' IQD';
  </script>
</body>
</html>
