<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستەمی حسابات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow-lg">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">سیستەمی بەڕێوەبردنی حسابات</h1>

    <!-- کارتی ئامارەکان -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 text-center">
      <div class="bg-green-50 p-4 rounded-xl border border-green-200">
        <p class="text-sm text-green-600 font-semibold">کۆی داهات</p>
        <p id="totalIncome" class="text-xl font-bold text-green-700">$0</p>
      </div>
      <div class="bg-red-50 p-4 rounded-xl border border-red-200">
        <p class="text-sm text-red-600 font-semibold">کۆی خەرجی</p>
        <p id="totalExpense" class="text-xl font-bold text-red-700">$0</p>
      </div>
      <div class="bg-blue-50 p-4 rounded-xl border border-blue-200">
        <p class="text-sm text-blue-600 font-semibold">باڵانسی گشتی</p>
        <p id="netBalance" class="text-xl font-bold text-blue-700">$0</p>
      </div>
    </div>

    <!-- فۆڕمی تۆمارکردن -->
    <form id="txForm" class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-6">
      <input type="text" id="desc" placeholder="وەسف (بۆ نموونە: مووچە، کڕینی کاڵا)" required class="border p-2 rounded-lg text-sm md:col-span-2">
      <input type="number" id="amount" placeholder="بڕی پارە" required class="border p-2 rounded-lg text-sm">
      <select id="type" class="border p-2 rounded-lg text-sm bg-white">
        <option value="income">داهات (+)</option>
        <option value="expense">خەرجی (-)</option>
      </select>
      <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg md:col-span-4 transition">زیادکردن</button>
    </form>

    <!-- خشتەی مامەڵەکان -->
    <div class="overflow-x-auto">
      <table class="w-full text-right border-collapse">
        <thead>
          <tr class="bg-gray-50 border-b">
            <th class="p-3 text-sm font-semibold text-gray-600">وەسف</th>
            <th class="p-3 text-sm font-semibold text-gray-600">بڕ</th>
            <th class="p-3 text-sm font-semibold text-gray-600">جۆر</th>
            <th class="p-3 text-sm font-semibold text-gray-600">کردار</th>
          </tr>
        </thead>
        <tbody id="txList"></tbody>
      </table>
    </div>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem("tx_data")) || [];

    function updateUI() {
      const list = document.getElementById("txList");
      list.innerHTML = "";
      let income = 0, expense = 0;

      transactions.forEach((tx, index) => {
        const amount = parseFloat(tx.amount);
        if (tx.type === "income") income += amount;
        else expense += amount;

        const row = document.createElement("tr");
        row.className = "border-b hover:bg-gray-50 text-sm";
        row.innerHTML = `
          <td class="p-3 text-gray-800">${tx.desc}</td>
          <td class="p-3 font-semibold ${tx.type === 'income' ? 'text-green-600' : 'text-red-600'}">$${amount.toLocaleString()}</td>
          <td class="p-3"><span class="px-2 py-1 text-xs rounded-full ${tx.type === 'income' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${tx.type === 'income' ? 'داهات' : 'خەرجی'}</span></td>
          <td class="p-3"><button onclick="deleteTx(${index})" class="text-red-500 hover:text-red-700">سڕینەوە</button></td>
        `;
        list.appendChild(row);
      });

      document.getElementById("totalIncome").innerText = `$${income.toLocaleString()}`;
      document.getElementById("totalExpense").innerText = `$${expense.toLocaleString()}`;
      const balance = income - expense;
      const balEl = document.getElementById("netBalance");
      balEl.innerText = `$${balance.toLocaleString()}`;
      balEl.className = `text-xl font-bold ${balance >= 0 ? 'text-blue-700' : 'text-red-600'}`;

      localStorage.setItem("tx_data", JSON.stringify(transactions));
    }

    document.getElementById("txForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const desc = document.getElementById("desc").value;
      const amount = document.getElementById("amount").value;
      const type = document.getElementById("type").value;

      transactions.push({ desc, amount, type });
      updateUI();
      e.target.reset();
    });

    function deleteTx(index) {
      transactions.splice(index, 1);
      updateUI();
    }

    updateUI();
  </script>
</body>
</html>
