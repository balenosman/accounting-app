<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بەڕێوەبردنی کڕیاران</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800 p-6">
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- سەرپەڕ -->
    <div class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-xl font-bold text-slate-800">👥 بەشی کڕیاران و بازرگانەکان</h1>
        <p class="text-xs text-slate-500 mt-1">تۆمارکردن، ژمارەی پەیوەندی، ناونیشان و چاودێری باڵانسی قەرز</p>
      </div>
      <div class="text-left">
        <span class="text-xs text-slate-500 font-bold block">کۆی کڕیاران</span>
        <span id="totalCustomerCount" class="text-2xl font-black text-emerald-600">0</span>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- فۆڕمی زیادکردنی کڕیار -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 h-fit">
        <h2 class="text-base font-bold text-slate-800 mb-4 pb-2 border-b">زیادکردنی کڕیاری نوێ</h2>
        <form id="customerForm" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ناوی بازرگان / مارکێت *</label>
            <input type="text" id="custName" placeholder="بۆ نموونە: کۆمپانیای کاروان / مارکێتی سەروەر" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ژمارەی مۆبایل</label>
            <input type="text" id="custPhone" placeholder="0750 000 0000" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">شار / ناونیشان</label>
            <input type="text" id="custAddress" placeholder="سلێمانی، هەولێر..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">باڵانسی سەرەتایی (قەرزی پێشوو ئەگەر هەبێت)</label>
            <input type="number" step="any" id="custBalance" value="0" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">تێبینی</label>
            <textarea id="custNotes" rows="2" placeholder="تێبینی تایبەت..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm transition">تۆمارکردنی کڕیار</button>
        </form>
      </div>

      <!-- لیستی کڕیاران -->
      <div class="lg:col-span-2 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-base font-bold text-slate-800">لیستی سەرجەم کڕیارە تۆمارکراوەکان</h2>
          <input type="text" id="searchInput" onkeyup="filterCustomers()" placeholder="گەڕان بەپێی ناو یان شار..." class="border border-slate-300 rounded-lg px-3 py-1.5 text-xs w-52">
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-right text-sm">
            <thead class="bg-slate-50 border-b text-slate-600 text-xs">
              <tr>
                <th class="p-3">ناو</th>
                <th class="p-3">پەیوەندی</th>
                <th class="p-3">ناونیشان</th>
                <th class="p-3">باڵانس / قەرز</th>
                <th class="p-3">کردار</th>
              </tr>
            </thead>
            <tbody id="customersTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    let customers = JSON.parse(localStorage.getItem("oil_customers")) || [];

    function saveAndRender() {
      localStorage.setItem("oil_customers", JSON.stringify(customers));
      renderList(customers);
    }

    function renderList(list) {
      const tbody = document.getElementById("customersTableBody");
      tbody.innerHTML = "";
      document.getElementById("totalCustomerCount").innerText = customers.length;

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400 text-xs">هیچ کڕیارێک تۆمار نەکراوە</td></tr>`;
        return;
      }

      list.forEach((c) => {
        const balance = parseFloat(c.balance || 0);
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 font-bold text-slate-800">${c.name}</td>
            <td class="p-3 text-slate-600 text-xs" dir="ltr">${c.phone || "-"}</td>
            <td class="p-3 text-slate-600 text-xs">${c.address || "-"}</td>
            <td class="p-3 font-bold text-xs ${balance > 0 ? 'text-rose-600' : 'text-slate-600'}">
              ${balance.toLocaleString()} IQD
            </td>
            <td class="p-3">
              <button onclick="deleteCustomer(${c.id})" class="text-xs text-rose-500 hover:text-rose-700 font-semibold">سڕینەوە</button>
            </td>
          </tr>
        `;
      });
    }

    document.getElementById("customerForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const newCust = {
        id: Date.now(),
        name: document.getElementById("custName").value.trim(),
        phone: document.getElementById("custPhone").value.trim(),
        address: document.getElementById("custAddress").value.trim(),
        balance: parseFloat(document.getElementById("custBalance").value) || 0,
        notes: document.getElementById("custNotes").value.trim()
      };

      customers.push(newCust);
      saveAndRender();
      e.target.reset();
    });

    function deleteCustomer(id) {
      if (confirm("دڵنیایت لە سڕینەوەی ئەم کڕیارە؟")) {
        customers = customers.filter(c => c.id !== id);
        saveAndRender();
      }
    }

    function filterCustomers() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const filtered = customers.filter(c => 
        c.name.toLowerCase().includes(q) || (c.address && c.address.toLowerCase().includes(q))
      );
      renderList(filtered);
    }

    renderList(customers);
  </script>
</body>
</html>
